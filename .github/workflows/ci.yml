name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # The module has no dependencies, so there is no go.sum and
          # setup-go skipped its cache on every run. Each run compiled
          # the standard library from cold (go vet took 21s). Hash go.mod
          # for the cache instead. Go checks cached objects by content
          # hash, so a stale entry is recompiled, never reused.
          cache-dependency-path: go.mod
      - run: go vet ./...
      # httptest + recorded fixtures, no network (see README)
      - run: go test ./...
      # pins quota numbers and canonical URLs to product ground truth
      - run: sh scripts/truthcheck.sh
